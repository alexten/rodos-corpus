# Сценарий C — рекламации (rodos-agent 05 §4.3, A-346): регистрация, подтверждение и передача по
# SALES-REGL-REKLAM, гарантийные сроки по SALES-POL-GARANTIYA. Свидетельства сроков и регистрации —
# дело РКЛ-2026-06 (переписка MAIL-2026-001…005, звонок, отчёт 8D) и сам реестр. Передачу в ОТК в день
# регистрации (п. 3.4) показывают письмо MAIL-2026-002 по РКЛ-2026-06 и служебная записка по
# РКЛ-2026-09 с отметкой ОТК о приёме; совместное решение менеджера и начальника ОТК о выезде (п. 5.2)
# — отдельный документ по РКЛ-2026-06, а письмо MAIL-2026-002 показывает только его срок. Отчёт 8D и
# разбор INC-2026-08 ни передачу в день регистрации, ни решение о выезде не называют — у пп. 3.4 и 5.2
# они свидетельствами не взяты.
# У пп. 2.1 и 2.2 гарантийного дела, где срок посчитан по политике, в корпусе нет. Свидетельства —
# проект договора АО «Редмаш» на 2027 год на типовой форме, взамен РМ-2025/01 (двенадцать месяцев на
# весь товар), где сроки политики входят в договор с конкретным заказчиком через приложение 3, и само
# приложение SALES-PRIL-GARANTIYA, в котором видны значения. Это применение политики в договорной форме,
# а не решение по гарантийному обращению. Технические условия и каталоги сроки пересказывают, а договор
# КС-2025/12 заключён до политики — свидетельствами они не взяты.
# У п. 2.4 дела, где условие договора взято вместо политики, в корпусе нет: свидетельства — договор
# РМ-2025/01 (12 месяцев на весь товар, для узлов короче политики, и старше её) и событие потока
# EVT-2026-0019, где это расхождение решает исход, — как EVT-2026-0010 у SKIDKI-5.3 (05 A-346).
