# Бизнес-правила предприятия и документы, в которых видно их ИСПОЛНЕНИЕ.
#
# Правило берётся из регламента; свидетельство — артефакт процесса по конкретному делу
# (предложение, счёт, спецификация, лист согласования, протокол), а НЕ пересказ правила в
# другом регламенте. Требование: у каждого правила не меньше двух свидетельств, потому что
# одно можно подогнать под правило, а два показывают, что правило действительно живёт.
#
# Набор правил — те, которые применяет агент: каталог вопросов `rodos-agent` 05 §4.
# Проверяется `rodos-corpus rules --check`: пункт существует в регламенте, документы
# существуют, свидетельств не меньше двух, регламент сам себе свидетельством не считается.
# FAQ и скрипты продаж свидетельствами не считаются: они правило пересказывают, а не
# исполняют. Свидетельство — документ по конкретному делу, где видно применённое значение.
# FAQ и скрипты продаж свидетельствами не считаются: они правило пересказывают, а не
# исполняют. Свидетельство — документ по конкретному делу, где видно применённое значение.
