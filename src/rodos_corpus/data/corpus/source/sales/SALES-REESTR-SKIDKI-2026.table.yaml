  note: >-
    Скидка, превышающая значения матрицы для категории заказчика, применяется только после согласования
    коммерческим директором до направления предложения заказчику — пункт 4.1 регламента
    SALES-REGL-SKIDKI и пункт 4.1 регламента SALES-REGL-KP. Не согласованная скидка сверх матрицы не
    применяется (пункт 4.3): в этом случае предложение направляется по ставке матрицы, что и
    зафиксировано в колонке «Применено фактически». Реестр имеет гриф ДСП, поскольку раскрывает ставки
    матрицы.
