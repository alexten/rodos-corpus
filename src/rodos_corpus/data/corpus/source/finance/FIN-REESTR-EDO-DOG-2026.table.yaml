  title: Реестр договоров, заключённых через ЭДО, и сроков повторной проверки контрагентов
  note: >-
    Договоры, заключаемые через систему электронного документооборота, хранятся в электронном виде —
    пункт 6.2 регламента FIN-REGL-DOGOVOR; бумажный экземпляр не оформляется, и колонка «Бумажный
    экземпляр» ведётся, чтобы это было видно. Колонка «Подписант» заполняется по сумме договора:
    до 5 000 000 ₽ — коммерческий директор (пункт 5.1), свыше — генеральный директор (пункт 5.2).
    Колонка «Повторная проверка до» — срок по пункту 5.1 регламента FIN-REGL-DOLZHOSM: не реже одного
    раза в 12 месяцев с даты предыдущей проверки. Проекты договоров на 2027 год в реестр не включены:
    они находятся на согласовании и не заключены.
