  note: >-
    Маршрут и сроки этапов — по пункту 3.1 регламента FIN-REGL-DOGOVOR, увязанному с графиком
    документооборота GRAFIK-DO-2026. Проект получен от контрагента 23.09.2026, поэтому инициатор
    приложил к нему документы по пункту 2.2. По этому договору предприятие выступает Покупателем, и
    условия сверялись с действующим договором закупки проката ПП-2025/14. Сумма договора указана в
    пункте 2.2 проекта — 6 200 000 ₽; она превышает 5 000 000 ₽, поэтому договор подписывает
    генеральный директор (пункт 5.2). К подписанию проект не передан: по разногласию № 1 протокола
    FIN-PROTOKOL-RAZN-TSU-2026 ожидается ответ контрагента.
